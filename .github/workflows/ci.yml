name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check workflow and release validator contracts
        run: |
          ruby scripts/check-workflow-contract.rb
          bash -n scripts/validate-release-ref.sh

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Run tests
        run: swift test
      - name: Build release binary
        run: swift build -c release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build and test native Windows companion
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Configuration Release -Publish
      - name: Run app-server and native lifecycle integration
        shell: pwsh
        run: ./scripts/test-windows-integration.ps1
