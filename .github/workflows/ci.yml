name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Build release binary
        run: swift build -c release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and test native Windows companion
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Configuration Release -Publish
      - name: Run app-server and native lifecycle integration
        shell: pwsh
        run: ./scripts/test-windows-integration.ps1
