name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: swift test
      - name: Build release binary
        run: swift build -c release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build and test native Windows companion
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Configuration Release -Publish
      - name: Run app-server and native lifecycle integration
        shell: pwsh
        run: ./scripts/test-windows-integration.ps1
      - name: Package Windows release assets
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          [xml]$project = Get-Content ./src/CodexUsageLoop.Windows/CodexUsageLoop.Windows.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          ./scripts/package-windows.ps1 -Version $version
      - name: Upload Windows release assets
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            dist/CodexUsageLoop-Windows-x64-*.zip
            dist/CodexUsageLoop-Windows-x64-*.zip.sha256
          if-no-files-found: error
